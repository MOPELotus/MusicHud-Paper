name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Fabric and Paper
        run: ./gradlew :paper:test :paper:build :fabric:build --console=plain --no-daemon

      - name: Collect release jars
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          PAPER_JAR="$(find paper/build/libs -maxdepth 1 -type f -name 'music_hud-paper-*-reobf.jar' | sort | tail -n 1)"
          FABRIC_JAR="$(find fabric/build/libs -maxdepth 1 -type f -name 'music_hud-fabric-*.jar' ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' | sort | tail -n 1)"
          test -n "$PAPER_JAR"
          test -n "$FABRIC_JAR"
          VERSION="${PAPER_JAR##*music_hud-paper-}"
          VERSION="${VERSION%-reobf.jar}"
          PACKAGE_NAME="MusicHud-Paper-${VERSION}"
          mkdir -p "out/${PACKAGE_NAME}"
          cp "$PAPER_JAR" "out/${PACKAGE_NAME}/"
          cp "$FABRIC_JAR" "out/${PACKAGE_NAME}/"
          (
            cd out
            zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"
          )
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: out/${{ steps.package.outputs.package_name }}.zip
          if-no-files-found: error
