name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag name
        required: true
        type: string
      release_name:
        description: Optional release title
        required: false
        type: string
      prerelease:
        description: Mark this release as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - 1.21.6-1.21.8
          - 1.21.9-1.21.10
          - 1.21.11

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Fabric, NeoForge and Paper
        run: ./gradlew :paper:test :paper:build :fabric:build :neoforge:build --console=plain --no-daemon

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/assets out/notes
          PAPER_JAR="$(find paper/build/libs -maxdepth 1 -type f -name 'music_hud-paper-*-reobf.jar' | sort | tail -n 1)"
          FABRIC_JAR="$(find fabric/build/libs -maxdepth 1 -type f -name 'music_hud-fabric-*.jar' ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' | sort | tail -n 1)"
          NEOFORGE_JAR="$(find neoforge/build/libs -maxdepth 1 -type f -name 'music_hud-neoforge-*.jar' ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' | sort | tail -n 1)"
          test -n "$PAPER_JAR"
          test -n "$FABRIC_JAR"
          test -n "$NEOFORGE_JAR"
          cp "$PAPER_JAR" out/assets/
          cp "$FABRIC_JAR" out/assets/
          cp "$NEOFORGE_JAR" out/assets/
          {
            echo "## ${{ matrix.branch }}"
            git log --oneline --decorate -20
            echo
          } > "out/notes/${{ matrix.branch }}.md"

      - name: Upload branch assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.branch }}
          path: out/assets/*
          if-no-files-found: error

      - name: Upload branch notes
        uses: actions/upload-artifact@v4
        with:
          name: notes-${{ matrix.branch }}
          path: out/notes/${{ matrix.branch }}.md
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download branch assets
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: release-assets

      - name: Download branch notes
        uses: actions/download-artifact@v4
        with:
          pattern: notes-*
          merge-multiple: true
          path: release-notes

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_NAME="${{ inputs.release_name }}"
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="${{ inputs.tag_name }}"
          fi
          {
            echo "# Commit History"
            echo
            for BRANCH in 1.21.6-1.21.8 1.21.9-1.21.10 1.21.11; do
              cat "release-notes/${BRANCH}.md"
            done
          } > RELEASE_NOTES.md
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: 1.21.11
          name: ${{ steps.meta.outputs.release_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ inputs.prerelease }}
          files: release-assets/*
