name: MusicHud-TuneWeave
version: '${version}'
main: indi.mopelotus.musichud.paper.CommonInitializer
api-version: '${apiVersion}'
description: TuneWeave public playback coordination; music accounts remain client-owned.
website: https://github.com/MOPELotus/MusicHud-TuneWeave
authors: [Etern]
contributors: [Lotus (Paper adapter)]
folia-supported: true
commands:
  musichud:
    description: MusicHud TuneWeave administration
    usage: /musichud help
    aliases: [musichud-tuneweave, mt]
permissions:
  musichud.admin:
    description: MusicHud TuneWeave administrator commands
    default: op
