name: MusicHud
version: '${version}'
main: indi.etern.musichud.paper.CommonInitializer
api-version: '${apiVersion}'
description: Request music in whole server powered by Netease Cloud Music (NCM) | 一个基于网易云的全服点歌模组
website: https://github.com/Etern-34520/MusicHud
authors: [Etern]
contributors: [Lotus (Paper adapter)]
folia-supported: true
permissions:
  musichud.admin:
    description: Allows managing MusicHud server configuration, playback and player diagnostics.
    default: false
    children:
      musichud.reload: true
  musichud.reload:
    description: Allows reloading MusicHud Paper configuration from disk.
    default: op
