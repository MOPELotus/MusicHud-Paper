plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id 'com.gradleup.shadow'
    id 'xyz.jpenilla.run-paper' version '3.0.2'
}

base {
    archivesName = "$rootProject.archives_name-$project.name"
}

sourceSets {
    main {
        java {
            srcDir project(':common').file('src/main/java')
        }
        resources {
            srcDir project(':common').file('src/main/resources')
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'PaperMC'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = "IzzelAliz Maven"
        url = "https://maven.izzel.io/releases/"
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "JitPack"
        url = 'https://jitpack.io'
    }
    maven {
        name "dv8tion"
        url "https://m2.dv8tion.net/releases"
    }
    flatDir {
        dir rootProject.file('libs')
    }
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

def mergedMinecraftJar = providers.provider {
    def minecraftMaven = rootProject.file(".gradle/loom-cache/minecraftMaven/net/minecraft")
    def matches = fileTree(minecraftMaven) {
        include "minecraft-merged-*/${rootProject.minecraft_version}/minecraft-merged-*-${rootProject.minecraft_version}.jar"
    }.files
    if (matches.empty) {
        throw new GradleException("Merged Minecraft jar not found in ${minecraftMaven}; run :common:compileJava first")
    }
    matches.sort { it.name }.last()
}

dependencies {
    paperweight.paperDevBundle("${rootProject.minecraft_version}.build.+")

    // Fabric merged jar provides client+server classes not in Paper's server jar
    compileOnly files(mergedMinecraftJar)

    // LWJGL — needed for client-side audio code in common
    compileOnly "org.lwjgl:lwjgl-openal:3.3.3"
    compileOnly "org.lwjgl:lwjgl-glfw:3.3.3"

    compileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    compileOnly "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    compileOnly "org.spongepowered:mixin:0.8.7"

    compileOnly "icyllis.modernui:ModernUI-Fabric:26.2-${rootProject.modernui_version}.+"
    compileOnly "dev.icyllis:modernui-core:$rootProject.modernui_version"

    compileOnly "javax.annotation:javax.annotation-api:1.3.2"

    implementation "com.sedmelluq:lavaplayer:$rootProject.lavaplayer_version"
    shadowBundle "com.sedmelluq:lavaplayer:$rootProject.lavaplayer_version"

//    compileOnly "io.github.selemba1000:JavaMediaTransportControls:$rootProject.jmtc_version"
    compileOnly "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    compileOnly "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"

    shadowBundle(project(':common')) { transitive = false }

    compileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    annotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    testCompileOnly "org.projectlombok:lombok:$rootProject.lombok_version"
    testAnnotationProcessor "org.projectlombok:lombok:$rootProject.lombok_version"
    testImplementation "org.junit.jupiter:junit-jupiter:$rootProject.junit_version"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava') {
    dependsOn ':common:compileJava'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property('version', project.version)
    inputs.property('apiVersion', rootProject.minecraft_version)
    filesMatching('paper-plugin.yml') {
        expand(
                version: project.minecraft_api_version,
                apiVersion: rootProject.minecraft_api_version
        )
    }
    filesMatching('plugin.yml') {
        expand(
                version: project.minecraft_api_version,
                apiVersion: rootProject.minecraft_api_version
        )
    }
}

tasks.shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

tasks.jar {
    dependsOn shadowJar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(zipTree(shadowJar.archiveFile))
}

tasks.jar {
    dependsOn shadowJar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(zipTree(shadowJar.archiveFile))
}

tasks.reobfJar {
    inputJar.set(tasks.shadowJar.archiveFile)
    dependsOn(tasks.shadowJar)
}

tasks.assemble {
    // MC 26.2 is deobfuscated, reobfJar not needed
}

tasks.runServer {
    minecraftVersion(rootProject.minecraft_version)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
